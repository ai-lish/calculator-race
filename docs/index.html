<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🧮 計算機大賽 — Calculator Race</title>
<meta name="description" content="60秒計算機挑戰！使用CASIO fx50FHII快問快答，支援多個難度級別。">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1a2e;--card:#16213e;--accent:#e94560;
  --gold:#f5c518;--teal:#0f3460;--text:#eaeaea;
  --easy:#2ecc71;--med:#f39c12;--hard:#e74c3c;
}
body{
  font-family:'Noto Sans TC',sans-serif;
  background:var(--bg);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:16px;color:var(--text);
}
.container{
  background:var(--card);
  border-radius:16px;
  width:100%;max-width:520px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  overflow:hidden;
  position:relative;
}
/* Header */
.header{
  background:linear-gradient(135deg,#e94560,#ff6b6b);
  padding:20px;text-align:center;
}
.header h1{font-size:1.6rem;font-weight:900;color:#fff}
.header p{color:rgba(255,255,255,.8);font-size:.85rem;margin-top:4px}
.header .subtitle{
  display:flex;gap:8px;justify-content:center;margin-top:8px;
}
.header .badge{
  background:rgba(255,255,255,.2);color:#fff;
  padding:3px 10px;border-radius:20px;font-size:.75rem;
}
/* Mode tabs */
.tab-bar{display:flex;background:rgba(0,0,0,.2)}
.tab{
  flex:1;padding:14px 0;border:none;
  font-size:.95rem;font-weight:700;cursor:pointer;
  background:transparent;color:rgba(255,255,255,.5);
  transition:all .2s;font-family:inherit;
  border-bottom:3px solid transparent;
}
.tab.active{color:#fff;border-bottom-color:var(--gold);background:rgba(255,255,255,.05)}
.tab:hover:not(.active){color:rgba(255,255,255,.8)}
/* Difficulty select */
.mode-select{padding:24px;text-align:center}
.mode-select h2{font-size:1.1rem;margin-bottom:16px;color:var(--gold)}
.modes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.mode-btn{
  padding:12px 20px;border:none;border-radius:10px;
  font-weight:700;font-size:1rem;cursor:pointer;
  transition:transform .15s,box-shadow .15s;
  font-family:inherit;
  display:flex;flex-direction:column;align-items:center;min-width:72px;
}
.mode-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.3)}
.mode-btn.easy{background:var(--easy);color:#fff}
.mode-btn.med{background:var(--med);color:#fff}
.mode-btn.hard{background:var(--hard);color:#fff}
.mode-btn.all{background:var(--teal);color:#fff}
.mode-btn span{display:block;font-size:.7rem;opacity:.8;margin-top:2px}
.mode-btn small{font-size:.65rem;opacity:.7;margin-top:1px}
/* Game area */
.game-area{padding:24px;display:none}
.timer-bar{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.05);
  padding:10px 14px;border-radius:10px;
  margin-bottom:16px;
}
.timer-label{font-weight:700;color:var(--gold);white-space:nowrap}
.timer-track{flex:1;height:8px;background:#333;border-radius:4px;overflow:hidden}
.timer-fill{height:100%;background:var(--accent);width:100%;transition:width 1s linear;border-radius:4px}
.timer-text{font-weight:900;font-size:1.1rem;min-width:40px;text-align:right}
.timer-warning .timer-fill{background:var(--hard);animation:pulse .5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.score-board{
  display:flex;justify-content:space-between;
  background:rgba(255,255,255,.05);
  padding:10px 14px;border-radius:10px;
  margin-bottom:16px;font-size:.9rem;
}
.score-pos{color:var(--easy);font-weight:700}
.score-neg{color:var(--hard);font-weight:700}
.difficulty-badge{
  display:inline-block;padding:3px 10px;border-radius:20px;
  font-size:.75rem;font-weight:700;color:#fff;
}
.difficulty-badge.easy{background:var(--easy)}
.difficulty-badge.med{background:var(--med)}
.difficulty-badge.hard{background:var(--hard)}
/* Question */
.question-display{
  background:rgba(255,255,255,.08);
  border-radius:12px;
  padding:20px;text-align:center;
  margin-bottom:16px;
}
.question-expr{
  font-size:2rem;font-weight:900;
  letter-spacing:2px;
  color:#fff;
  word-break:break-all;
  min-height:2.5rem;display:flex;align-items:center;justify-content:center;
}
.question-unit{
  font-size:.85rem;color:rgba(255,255,255,.6);
  margin-top:6px;
}
/* Input */
.input-area{text-align:center}
.calc-input{
  width:100%;max-width:280px;
  font-size:1.8rem;font-weight:700;
  padding:12px;text-align:center;
  border:3px solid rgba(255,255,255,.2);
  border-radius:10px;
  background:rgba(255,255,255,.05);
  color:#fff;font-family:inherit;
  letter-spacing:2px;
}
.calc-input:focus{outline:none;border-color:var(--accent)}
.hint-text{font-size:.78rem;color:rgba(255,255,255,.4);margin-top:6px}
/* Keys */
.keyboard{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:340px;margin:16px auto 0}
.key{
  padding:14px 0;border:none;border-radius:10px;
  font-size:1.2rem;font-weight:700;cursor:pointer;
  background:rgba(255,255,255,.1);color:#fff;
  transition:background .1s,transform .1s;font-family:inherit;
}
.key:hover{background:rgba(255,255,255,.2)}
.key:active{transform:scale(.95)}
.key.clear{background:#e74c3c}
.key.del{background:#e67e22}
.key.submit{background:var(--accent)}
.key.next{background:var(--teal);grid-column:span 3}
/* Result flash */
.result-correct{border-color:#2ecc71!important;background:rgba(46,204,113,.15)!important}
.result-wrong{border-color:#e74c3c!important;background:rgba(231,76,60,.15)!important}
/* End screen */
.end-area{padding:24px;text-align:center;display:none}
.end-area h2{font-size:1.4rem;color:var(--gold);margin-bottom:16px}
.final-score{font-size:3rem;font-weight:900;color:#fff;margin-bottom:8px}
.final-detail{color:rgba(255,255,255,.6);font-size:.9rem;margin-bottom:20px}
.stat-row{display:flex;justify-content:center;gap:24px;margin-bottom:20px}
.stat{text-align:center}
.stat-n{font-size:1.6rem;font-weight:900}
.stat-l{font-size:.75rem;color:rgba(255,255,255,.5);margin-top:2px}
.result-correct-text{color:var(--easy)}
.result-wrong-text{color:var(--hard)}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.play-again{
  background:var(--accent);color:#fff;
  border:none;padding:14px 28px;border-radius:10px;
  font-size:1rem;font-weight:700;cursor:pointer;
  font-family:inherit;transition:transform .15s;
}
.play-again:hover{transform:translateY(-2px)}
.submit-score{
  background:var(--gold);color:#1a1a2e;
  border:none;padding:14px 28px;border-radius:10px;
  font-size:1rem;font-weight:700;cursor:pointer;
  font-family:inherit;transition:transform .15s;
}
.submit-score:hover{transform:translateY(-2px)}
.submit-score:disabled{opacity:.5;cursor:not-allowed;transform:none}
.submit-msg{margin-top:10px;font-size:.85rem}
/* Name input */
.name-area{padding:24px;text-align:center;display:none}
.name-area h2{font-size:1.2rem;margin-bottom:12px;color:var(--gold)}
.name-input{
  width:100%;max-width:260px;
  padding:12px;font-size:1rem;text-align:center;
  border:2px solid rgba(255,255,255,.2);
  border-radius:8px;background:rgba(255,255,255,.05);
  color:#fff;font-family:inherit;margin-bottom:8px;
}
.name-input:focus{outline:none;border-color:var(--accent)}
.name-hint{font-size:.78rem;color:rgba(255,255,255,.4);margin-bottom:16px}
.name-submit{
  background:var(--accent);color:#fff;
  border:none;padding:12px 28px;border-radius:8px;
  font-size:1rem;font-weight:700;cursor:pointer;
  font-family:inherit;margin-bottom:8px;
}
.name-submit:disabled{opacity:.5;cursor:not-allowed}
/* Leaderboard */
.leaderboard-area{padding:0 24px 24px}
.leaderboard-area h3{color:var(--gold);font-size:.95rem;margin-bottom:10px;text-align:center}
.leaderboard-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.leaderboard-col{
  background:rgba(255,255,255,.05);
  border-radius:10px;padding:10px;
}
.leaderboard-col-title{
  font-weight:700;font-size:.85rem;margin-bottom:6px;
}
.leaderboard-empty{color:rgba(255,255,255,.3);font-size:.7rem;text-align:center;padding:8px 0}
.leaderboard-entry{
  display:flex;justify-content:space-between;
  font-size:.75rem;color:rgba(255,255,255,.7);margin:3px 0;
  align-items:center;
}
.leaderboard-rank{opacity:.5;margin-right:4px}
.leaderboard-score{font-weight:700}
.leaderboard-loading{padding:20px;text-align:center;color:rgba(255,255,255,.4);font-size:.85rem}
/* Config banner */
.config-banner{
  background:rgba(255,193,7,.15);border:1px solid rgba(255,193,7,.3);
  padding:8px 16px;border-radius:8px;margin:16px;
  font-size:.8rem;color:var(--gold);text-align:center;
}
.config-banner a{color:var(--gold);font-weight:700}
/* Loading */
.loading{padding:40px;text-align:center;color:rgba(255,255,255,.5)}
/* Mobile */
@media(max-width:480px){
  .header h1{font-size:1.3rem}
  .question-expr{font-size:1.6rem}
  .calc-input{font-size:1.5rem}
  .keyboard{max-width:300px}
  .key{padding:12px 0;font-size:1.1rem}
  .leaderboard-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="container" id="app">

  <!-- Config Banner (shown when not configured) -->
  <div class="config-banner" id="configBanner" style="display:none">
    ⚙️ 尚未設定題目庫 | <a href="docs/SETUP.md" target="_blank">查看設定指南</a>
  </div>

  <!-- Header -->
  <div class="header">
    <h1>🧮 計算機大賽</h1>
    <p>60秒快問快答！</p>
    <div class="subtitle">
      <span class="badge">CASIO fx50FHII</span>
      <span class="badge" id="difficultyBadge">Easy</span>
    </div>
  </div>

  <!-- Mode tabs -->
  <div class="tab-bar" id="tabBar">
    <button class="tab active" id="tabEasy" onclick="selectDifficulty('Easy')">🌱 Easy</button>
    <button class="tab" id="tabMedium" onclick="selectDifficulty('Medium')">🌿 Medium</button>
    <button class="tab" id="tabHard" onclick="selectDifficulty('Hard')">🔥 Hard</button>
    <button class="tab" id="tabMixed" onclick="selectDifficulty('Mixed')">🎲 混合</button>
  </div>

  <!-- Start screen -->
  <div class="mode-select" id="modeSelect">
    <h2>📋 玩法說明</h2>
    <div style="text-align:left;max-width:360px;margin:0 auto 20px;background:rgba(255,255,255,.05);padding:16px;border-radius:10px;font-size:.88rem;line-height:1.7">
      <p>🎯 在 <strong>60秒</strong> 內回答盡可能多的題目</p>
      <p>✖️ 答錯 <span style="color:var(--hard)">扣1分</span>，答對 <span style="color:var(--easy)">加1分</span></p>
      <p>🧮 使用 <strong>CASIO fx50FHII</strong> 計算（答案取3位有效數字）</p>
      <p>📊 完成後可提交分數到排行榜</p>
    </div>
    <button class="play-again" onclick="startGame()" style="font-size:1.2rem;padding:16px 40px">
      🎮 開始挑戰
    </button>
  </div>

  <!-- Leaderboard -->
  <div class="leaderboard-area" id="leaderboardArea">
    <h3>🏆 龍虎榜 <span id="leaderboardDiffLabel" style="font-weight:400;font-size:.8rem;opacity:.7"></span></h3>
    <div id="leaderboardLoading" class="leaderboard-loading">載入中...</div>
    <div class="leaderboard-grid" id="leaderboardGrid" style="display:none"></div>
  </div>

  <!-- Game Area -->
  <div class="game-area" id="gameArea">
    <div class="timer-bar" id="timerBar">
      <span class="timer-label">⏱️ 時間</span>
      <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
      <span class="timer-text" id="timerText">60</span>
    </div>
    <div class="score-board">
      <span>✅ <span class="score-pos" id="correctCount">0</span></span>
      <span id="diffBadge" class="difficulty-badge easy">Easy</span>
      <span>❌ <span class="score-neg" id="wrongCount">0</span></span>
    </div>
    <div class="question-display">
      <div class="question-expr" id="questionExpr"></div>
      <div class="question-unit" id="questionNote">使用 CASIO fx50FHII 計算</div>
    </div>
    <div class="input-area">
      <input type="text" class="calc-input" id="calcInput" placeholder="?" autocomplete="off" readonly onclick="this.blur()">
      <div class="hint-text" id="gameHint">輸入答案後按 ✓ 提交</div>
    </div>
    <div class="keyboard" id="keyboard">
      <button class="key" onclick="typeKey('7')">7</button>
      <button class="key" onclick="typeKey('8')">8</button>
      <button class="key" onclick="typeKey('9')">9</button>
      <button class="key" onclick="typeKey('.')">.</button>
      <button class="key" onclick="typeKey('4')">4</button>
      <button class="key" onclick="typeKey('5')">5</button>
      <button class="key" onclick="typeKey('6')">6</button>
      <button class="key" onclick="typeKey('-')">±</button>
      <button class="key" onclick="typeKey('1')">1</button>
      <button class="key" onclick="typeKey('2')">2</button>
      <button class="key" onclick="typeKey('3')">3</button>
      <button class="key" onclick="typeKey('0')">0</button>
      <button class="key clear" onclick="typeKey('clear')">C</button>
      <button class="key del" onclick="typeKey('del')">DEL</button>
      <button class="key submit" onclick="submitAns()">✓</button>
    </div>
  </div>

  <!-- End Screen -->
  <div class="end-area" id="endArea">
    <h2>⏱️ 時間到！</h2>
    <div class="final-score" id="finalScore">0</div>
    <div class="final-detail">最終得分</div>
    <div class="stat-row">
      <div class="stat">
        <div class="stat-n result-correct-text" id="finalCorrect">0</div>
        <div class="stat-l">答對</div>
      </div>
      <div class="stat">
        <div class="stat-n result-wrong-text" id="finalWrong">0</div>
        <div class="stat-l">答錯</div>
      </div>
      <div class="stat">
        <div class="stat-n" id="finalAccuracy">0%</div>
        <div class="stat-l">準確率</div>
      </div>
    </div>
    <div class="btn-row">
      <button class="play-again" onclick="goHome()">再玩一次</button>
      <button class="submit-score" id="submitScoreBtn" onclick="showNameInput()">📤 提交分數</button>
    </div>
    <div id="submitMsg" class="submit-msg"></div>
  </div>

  <!-- Name Input Screen -->
  <div class="name-area" id="nameArea">
    <h2>📤 提交分數</h2>
    <input type="text" class="name-input" id="playerName" placeholder="輸入你的名字" maxlength="20" autocomplete="off">
    <div class="name-hint">分數：<span id="nameScorePreview">0</span> 分 | <span id="nameDiffPreview">Easy</span></div>
    <button class="name-submit" id="nameSubmitBtn" onclick="submitScore()">提交</button>
    <div id="nameMsg" class="submit-msg"></div>
    <button onclick="skipNameSubmit()" style="background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;font-size:.8rem;margin-top:10px">略過</button>
  </div>

</div>

<script>
// ============================================================
// Calculator Race Game
// Frontend: index.html
// Backend:  Google Sheets (via Apps Script)
// ============================================================

const GAME_DURATION = 60; // seconds
const TOLERANCE = 0.02;   // 2% tolerance for floating point

// ============================================================
// CONFIG — 請根據你的 Google Sheet 填寫以下值
// ============================================================
const CONFIG = {
  // Google Sheet CSV 導出 URL（公開閱讀）
  // 格式：https://docs.google.com/spreadsheets/d/{SHEET_ID}/export?format=csv&gid={GID}
  // 留空則使用內置50條示範題目
  SHEET_CSV_URL: '',

  // Google Apps Script Web App 提交分數 URL
  // 格式：https://script.google.com/macros/s/{SCRIPT_ID}/exec
  // 留空則只保存在 localStorage
  SCORE_SUBMIT_URL: '',

  // Google Apps Script Web App 讀取分數 URL
  // 格式：https://script.google.com/macros/s/{SCRIPT_ID}/exec?action=leaderboard
  // 留空則只使用 localStorage
  LEADERBOARD_URL: '',
};
// ============================================================

// State
let questions = [];
let allQuestions = [];
let gameDifficulty = 'Easy'; // Easy | Medium | Hard | Mixed
let gameTimer = null;
let timeLeft = GAME_DURATION;
let correctCount = 0;
let wrongCount = 0;
let currentQ = null;
let answered = false;
let answeredCount = 0;
let gameStartTime = null;
let finalScore = 0;

// ============================================================
// QUESTIONS LOADING
// ============================================================

// Built-in 50 questions (sample from CSV)
const BUILTIN_QUESTIONS = [
  {id:'calc-001',expression:'24/3',answer:8,difficulty:'Easy',topics:'arithmetic'},
  {id:'calc-002',expression:'7+5',answer:12,difficulty:'Easy',topics:'arithmetic'},
  {id:'calc-003',expression:'15-8',answer:7,difficulty:'Easy',topics:'arithmetic'},
  {id:'calc-004',expression:'9*6',answer:54,difficulty:'Easy',topics:'arithmetic'},
  {id:'calc-005',expression:'0.75*16',answer:12,difficulty:'Easy',topics:'decimal'},
  {id:'calc-006',expression:'5/8*64',answer:40,difficulty:'Easy',topics:'fraction'},
  {id:'calc-007',expression:'0.25*240',answer:60,difficulty:'Easy',topics:'percentage'},
  {id:'calc-008',expression:'0.125+0.375',answer:0.5,difficulty:'Easy',topics:'decimal'},
  {id:'calc-009',expression:'14/0.7',answer:20,difficulty:'Easy',topics:'division'},
  {id:'calc-010',expression:'6^2',answer:36,difficulty:'Easy',topics:'exponent'},
  {id:'calc-011',expression:'sqrt(49)',answer:7,difficulty:'Easy',topics:'root'},
  {id:'calc-012',expression:'27^(1/3)',answer:3,difficulty:'Easy',topics:'root'},
  {id:'calc-013',expression:'0.2*1000',answer:200,difficulty:'Easy',topics:'scientific'},
  {id:'calc-014',expression:'3/8',answer:0.375,difficulty:'Easy',topics:'fraction'},
  {id:'calc-015',expression:'0.45*200',answer:90,difficulty:'Easy',topics:'percentage'},
  {id:'calc-016',expression:'(1/3)*3',answer:1,difficulty:'Easy',topics:'fraction'},
  {id:'calc-017',expression:'5+3*2',answer:11,difficulty:'Easy',topics:'order_of_operations'},
  {id:'calc-018',expression:'(5+3)*2',answer:16,difficulty:'Easy',topics:'brackets'},
  {id:'calc-019',expression:'100/4-3',answer:22,difficulty:'Easy',topics:'arithmetic'},
  {id:'calc-020',expression:'8*0.125',answer:1,difficulty:'Easy',topics:'decimal'},
  {id:'calc-021',expression:'sqrt(2)',answer:1.41,difficulty:'Medium',topics:'root'},
  {id:'calc-022',expression:'sqrt(50)',answer:7.07,difficulty:'Medium',topics:'root'},
  {id:'calc-023',expression:'log10(1000)',answer:3,difficulty:'Medium',topics:'log'},
  {id:'calc-024',expression:'ln(e^2)',answer:2,difficulty:'Medium',topics:'log'},
  {id:'calc-025',expression:'sin(30)',answer:0.5,difficulty:'Medium',topics:'trig'},
  {id:'calc-026',expression:'cos(60)',answer:0.5,difficulty:'Medium',topics:'trig'},
  {id:'calc-027',expression:'tan(45)',answer:1,difficulty:'Medium',topics:'trig'},
  {id:'calc-028',expression:'3.2^2',answer:10.2,difficulty:'Medium',topics:'exponent'},
  {id:'calc-029',expression:'7/12*100',answer:58.3,difficulty:'Medium',topics:'percentage'},
  {id:'calc-030',expression:'0.005*3.4e4',answer:170,difficulty:'Medium',topics:'scientific'},
  {id:'calc-031',expression:'(5/6)+0.25',answer:1.08,difficulty:'Medium',topics:'fraction'},
  {id:'calc-032',expression:'((2+3)^3)/5',answer:25,difficulty:'Medium',topics:'exponent'},
  {id:'calc-033',expression:'log10(250)',answer:2.4,difficulty:'Medium',topics:'log'},
  {id:'calc-034',expression:'sin(45)*sqrt(2)',answer:1,difficulty:'Medium',topics:'trig;root'},
  {id:'calc-035',expression:'(15/120)*100',answer:12.5,difficulty:'Medium',topics:'percentage'},
  {id:'calc-036',expression:'3*pi',answer:9.42,difficulty:'Medium',topics:'pi'},
  {id:'calc-037',expression:'pi*3^2',answer:28.3,difficulty:'Medium',topics:'area;pi'},
  {id:'calc-038',expression:'(4/3)*pi*2^3',answer:33.5,difficulty:'Medium',topics:'volume;pi'},
  {id:'calc-039',expression:'e',answer:2.72,difficulty:'Medium',topics:'exponent'},
  {id:'calc-040',expression:'sqrt(0.02)',answer:0.141,difficulty:'Medium',topics:'root'},
  {id:'calc-041',expression:'pi^2',answer:9.87,difficulty:'Hard',topics:'pi'},
  {id:'calc-042',expression:'ln(50)',answer:3.91,difficulty:'Hard',topics:'log'},
  {id:'calc-043',expression:'arcsin(0.5)',answer:30,difficulty:'Hard',topics:'trig'},
  {id:'calc-044',expression:'arctan(1)',answer:45,difficulty:'Hard',topics:'trig'},
  {id:'calc-045',expression:'5.5^(3/2)',answer:12.9,difficulty:'Hard',topics:'exponent'},
  {id:'calc-046',expression:'2*log10(7.5)',answer:1.75,difficulty:'Hard',topics:'log'},
  {id:'calc-047',expression:'2^10/3',answer:341,difficulty:'Hard',topics:'exponent'},
  {id:'calc-048',expression:'(pi+e)^2',answer:34.3,difficulty:'Hard',topics:'pi;e'},
  {id:'calc-049',expression:'123456^(1/3)',answer:49.8,difficulty:'Hard',topics:'root'},
  {id:'calc-050',expression:'sin(75)+cos(30)',answer:1.83,difficulty:'Hard',topics:'trig'},
];

async function loadQuestions() {
  questions = BUILTIN_QUESTIONS;
  allQuestions = [...BUILTIN_QUESTIONS];

  if (CONFIG.SHEET_CSV_URL) {
    try {
      const resp = await fetch(CONFIG.SHEET_CSV_URL);
      if (resp.ok) {
        const text = await resp.text();
        const parsed = parseCSV(text);
        if (parsed.length > 1) {
          // Skip header row
          allQuestions = parsed.slice(1).map(row => {
            if (row.length < 5) return null;
            return {
              id: row[0] || '',
              expression: row[1] || '',
              answer: parseFloat(row[2]) || 0,
              answerExact: row[3] || '',
              difficulty: row[4] || 'Easy',
              topics: row[5] || '',
            };
          }).filter(Boolean);
          questions = allQuestions;
          console.log(`[CalculatorRace] Loaded ${questions.length} questions from Google Sheet`);
        }
      }
    } catch (e) {
      console.warn('[CalculatorRace] Failed to load from Google Sheet, using built-in questions:', e);
    }
  } else {
    document.getElementById('configBanner').style.display = 'block';
  }

  // Show question count on difficulty tabs
  updateDifficultyTabs();
}

function parseCSV(text) {
  const lines = text.split('\n');
  return lines.map(line => {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        inQuotes = !inQuotes;
      } else if (ch === ',' && !inQuotes) {
        result.push(current.trim());
        current = '';
      } else {
        current += ch;
      }
    }
    result.push(current.trim());
    return result;
  });
}

function getFilteredQuestions() {
  if (gameDifficulty === 'Mixed') return allQuestions;
  return allQuestions.filter(q => q.difficulty === gameDifficulty);
}

function updateDifficultyTabs() {
  const diffs = ['Easy', 'Medium', 'Hard', 'Mixed'];
  diffs.forEach(d => {
    const count = d === 'Mixed' ? allQuestions.length : allQuestions.filter(q => q.difficulty === d).length;
    const tab = document.getElementById('tab' + d);
    if (tab && count > 0) {
      tab.querySelector('span')?.remove();
      const span = document.createElement('span');
      span.style.cssText = 'display:block;font-size:.6rem;opacity:.7;margin-top:1px';
      span.textContent = count + '題';
      tab.appendChild(span);
    }
  });
}

// ============================================================
// LATEX FORMATTING
// ============================================================

function formatExpression(expr) {
  if (!expr) return '';
  let latex = String(expr)
    // Scientific notation: 1.33e+03 → 1.33×10^3
    .replace(/(\d+\.?\d*)e\+(\d+)/gi, '$1\\times10^{$2}')
    .replace(/(\d+\.?\d*)e-(\d+)/gi, '$1\\times10^{-$2}')
    // Powers: 2**5 or 2^5 → 2^5
    .replace(/\*\*/g, '^')
    // Multiplication: * → ×
    .replace(/\*/g, '\\times ')
    // Square root: sqrt(x) → √x
    .replace(/sqrt\(([^)]+)\)/g, '\\sqrt{$1}')
    // log10 → log₁₀
    .replace(/log10\(([^)]+)\)/g, '\\log_{10}($1)')
    // ln → ln
    .replace(/ln\(([^)]+)\)/g, '\\ln($1)')
    // sin/cos/tan/arctan/arcsin
    .replace(/sin\(/g, '\\sin(')
    .replace(/cos\(/g, '\\cos(')
    .replace(/tan\(/g, '\\tan(')
    .replace(/arctan\(/g, '\\arctan(')
    .replace(/arcsin\(/g, '\\arcsin(')
    // pi → π
    .replace(/\bpi\b/g, '\\pi')
    // e (Euler's number) — surrounded by operators
    // e^ → e^  (keep as-is, KaTeX renders it fine)
    // Clean up
    .replace(/\s+/g, ' ')
    .trim();
  return latex;
}

function getQuestionNote(expr, topics) {
  const lower = (expr || '').toLowerCase();
  if (lower.includes('sin') || lower.includes('cos') || lower.includes('tan') ||
      lower.includes('arctan') || lower.includes('arcsin')) {
    return '注意：使用 DEG 模式（角度制）';
  }
  if (lower.includes('log') || lower.includes('ln')) {
    return '注意：使用 LOG/LN 模式';
  }
  if (lower.includes('sqrt') || lower.includes('^')) {
    return '注意：使用正確的根號/冪運算';
  }
  return '使用 CASIO fx50FHII 計算';
}

// ============================================================
// GAME LOGIC
// ============================================================

function selectDifficulty(diff) {
  gameDifficulty = diff;
  ['Easy', 'Medium', 'Hard', 'Mixed'].forEach(d => {
    document.getElementById('tab' + d).classList.toggle('active', d === diff);
  });
  document.getElementById('leaderboardDiffLabel').textContent = diff === 'Mixed' ? '(混合模式)' : `(${diff})`;
  renderLeaderboard();
}

function startGame() {
  correctCount = 0;
  wrongCount = 0;
  answeredCount = 0;
  gameStartTime = Date.now();

  document.getElementById('correctCount').textContent = '0';
  document.getElementById('wrongCount').textContent = '0';
  document.getElementById('modeSelect').style.display = 'none';
  document.getElementById('leaderboardArea').style.display = 'none';
  document.getElementById('tabBar').style.display = 'none';
  document.getElementById('gameArea').style.display = 'block';
  document.getElementById('endArea').style.display = 'none';
  document.getElementById('nameArea').style.display = 'none';

  const badge = document.getElementById('diffBadge');
  badge.className = 'difficulty-badge ' + (gameDifficulty === 'Easy' ? 'easy' : gameDifficulty === 'Medium' ? 'med' : 'hard');
  badge.textContent = gameDifficulty;

  nextQuestion();
  startTimer();
  document.getElementById('calcInput').focus();

  document.getElementById('calcInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitAns();
  });
}

function nextQuestion() {
  const pool = getFilteredQuestions();
  if (pool.length === 0) return;
  const q = pool[Math.floor(Math.random() * pool.length)];
  currentQ = q;
  answered = false;

  const exprEl = document.getElementById('questionExpr');
  exprEl.innerHTML = '';
  try {
    katex.render(formatExpression(q.expression), exprEl, {
      throwOnError: false, displayMode: false
    });
  } catch(e) {
    exprEl.textContent = q.expression;
  }

  document.getElementById('questionNote').textContent = getQuestionNote(q.expression, q.topics);
  document.getElementById('questionNote').style.color = '';
  document.getElementById('calcInput').value = '';
  document.getElementById('calcInput').disabled = false;
  document.getElementById('calcInput').className = 'calc-input';
  document.getElementById('calcInput').focus();
}

function startTimer() {
  timeLeft = GAME_DURATION;
  updateTimerDisplay();
  if (gameTimer) clearInterval(gameTimer);
  gameTimer = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(gameTimer);
      endGame();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const fill = document.getElementById('timerFill');
  const text = document.getElementById('timerText');
  const bar = document.getElementById('timerBar');
  fill.style.width = (timeLeft / GAME_DURATION * 100) + '%';
  text.textContent = timeLeft;
  bar.classList.toggle('timer-warning', timeLeft <= 10);
}

function submitAns() {
  if (answered || !currentQ) return;
  answered = true;
  answeredCount++;

  const input = document.getElementById('calcInput').value.trim();
  if (!input) { answered = false; return; }

  const userAns = parseFloat(input.replace(/,/g, ''));
  const correctAns = currentQ.answer;

  if (isNaN(userAns) || isNaN(correctAns)) {
    wrongCount++;
    showResult(false, correctAns);
  } else {
    const tolerance = Math.abs(correctAns * TOLERANCE);
    const isCorrect = Math.abs(userAns - correctAns) <= tolerance;
    if (isCorrect) {
      correctCount++;
      showResult(true);
    } else {
      wrongCount++;
      showResult(false, correctAns);
    }
  }

  document.getElementById('correctCount').textContent = correctCount;
  document.getElementById('wrongCount').textContent = wrongCount;

  setTimeout(() => {
    document.getElementById('calcInput').disabled = false;
    nextQuestion();
  }, 600);
}

function showResult(correct, correctAns) {
  const inp = document.getElementById('calcInput');
  inp.disabled = true;
  inp.classList.add(correct ? 'result-correct' : 'result-wrong');
  if (!correct) {
    const note = document.getElementById('questionNote');
    note.textContent = '正確答案：' + formatAnswer(correctAns);
    note.style.color = '#f1c40f';
  }
  setTimeout(() => {
    inp.classList.remove('result-correct', 'result-wrong');
    inp.value = '';
  }, 600);
}

function formatAnswer(ans) {
  if (typeof ans !== 'number' || isNaN(ans)) return String(ans);
  if (Number.isInteger(ans)) return String(ans);
  // Use 3 significant figures for display
  if (Math.abs(ans) >= 1000) return ans.toPrecision(3);
  if (Math.abs(ans) < 0.001) return ans.toExponential(3);
  return parseFloat(ans.toFixed(3)).toString();
}

function typeKey(k) {
  const inp = document.getElementById('calcInput');
  if (inp.disabled) return;
  if (k === 'clear') {
    inp.value = '';
  } else if (k === 'del') {
    inp.value = inp.value.slice(0, -1);
  } else if (k === '-') {
    if (inp.value.startsWith('-')) inp.value = inp.value.slice(1);
    else inp.value = '-' + inp.value;
  } else {
    inp.value += k;
  }
  inp.focus();
}

function endGame() {
  finalScore = correctCount - wrongCount;
  const timeTaken = GAME_DURATION - timeLeft;

  document.getElementById('finalScore').textContent = finalScore;
  document.getElementById('finalCorrect').textContent = correctCount;
  document.getElementById('finalWrong').textContent = wrongCount;
  const total = correctCount + wrongCount;
  const acc = total > 0 ? Math.round(correctCount / total * 100) : 0;
  document.getElementById('finalAccuracy').textContent = acc + '%';

  document.getElementById('gameArea').style.display = 'none';
  document.getElementById('endArea').style.display = 'block';
  document.getElementById('nameArea').style.display = 'none';
  document.getElementById('submitScoreBtn').style.display = CONFIG.SCORE_SUBMIT_URL ? '' : 'none';
  document.getElementById('submitMsg').textContent = '';

  // Save to localStorage as fallback
  saveToLocalStorage({ name: 'Guest', score: finalScore, difficulty: gameDifficulty, timeTaken });
}

function goHome() {
  document.getElementById('endArea').style.display = 'none';
  document.getElementById('nameArea').style.display = 'none';
  document.getElementById('modeSelect').style.display = 'block';
  document.getElementById('leaderboardArea').style.display = 'block';
  document.getElementById('tabBar').style.display = 'flex';
  if (gameTimer) clearInterval(gameTimer);
}

function showNameInput() {
  document.getElementById('endArea').style.display = 'none';
  document.getElementById('nameArea').style.display = 'block';
  document.getElementById('nameScorePreview').textContent = finalScore;
  document.getElementById('nameDiffPreview').textContent = gameDifficulty;
  document.getElementById('nameMsg').textContent = '';
  document.getElementById('playerName').value = '';
  document.getElementById('playerName').focus();
}

function skipNameSubmit() {
  goHome();
}

// ============================================================
// SCORE SUBMISSION
// ============================================================

async function submitScore() {
  const name = document.getElementById('playerName').value.trim() || '匿名';
  const btn = document.getElementById('nameSubmitBtn');
  const msg = document.getElementById('nameMsg');

  btn.disabled = true;
  btn.textContent = '提交中...';
  msg.textContent = '';
  msg.style.color = '';

  const payload = {
    name,
    score: finalScore,
    difficulty: gameDifficulty,
    timeTaken: GAME_DURATION - timeLeft,
    timestamp: new Date().toISOString(),
  };

  // Try Apps Script endpoint
  if (CONFIG.SCORE_SUBMIT_URL) {
    try {
      const formData = new FormData();
      Object.entries(payload).forEach(([k, v]) => formData.append(k, v));

      const resp = await fetch(CONFIG.SCORE_SUBMIT_URL, {
        method: 'POST',
        body: formData,
        mode: 'no-cors', // no-cors needed for Apps Script
      });
      // With no-cors, we can't read the response — assume success
      msg.style.color = 'var(--easy)';
      msg.textContent = '✅ 分數已提交！';
    } catch (e) {
      msg.style.color = 'var(--med)';
      msg.textContent = '⚠️ 網絡錯誤，分數已保存本地';
    }
  }

  // Always save to localStorage as backup
  saveToLocalStorage(payload);

  btn.textContent = '已提交';
  setTimeout(() => { goHome(); renderLeaderboard(); }, 1500);
}

function saveToLocalStorage(entry) {
  try {
    const key = `calc_race_scores_${gameDifficulty}`;
    const existing = JSON.parse(localStorage.getItem(key) || '[]');
    existing.push(entry);
    // Keep top 100
    existing.sort((a, b) => b.score - a.score);
    localStorage.setItem(key, JSON.stringify(existing.slice(0, 100)));
  } catch(e) {}
}

// ============================================================
// LEADERBOARD
// ============================================================

async function renderLeaderboard() {
  const grid = document.getElementById('leaderboardGrid');
  const loading = document.getElementById('leaderboardLoading');

  if (!grid) return;
  grid.style.display = 'none';
  loading.style.display = 'block';

  // Collect from localStorage
  const localScores = {};
  ['Easy', 'Medium', 'Hard', 'Mixed'].forEach(d => {
    try {
      const key = `calc_race_scores_${d}`;
      localScores[d] = JSON.parse(localStorage.getItem(key) || '[]');
    } catch(e) { localScores[d] = []; }
  });

  // Try Apps Script leaderboard
  let remoteScores = {};
  if (CONFIG.LEADERBOARD_URL) {
    try {
      const resp = await fetch(CONFIG.LEADERBOARD_URL);
      if (resp.ok) {
        const data = await resp.json();
        remoteScores = data;
      }
    } catch(e) {}
  }

  // Merge remote with local (remote takes priority for same difficulty)
  const allScores = {};
  ['Easy', 'Medium', 'Hard', 'Mixed'].forEach(d => {
    const merged = [...(remoteScores[d] || []), ...(localScores[d] || [])];
    // Dedupe by name+score, keep top 3
    const seen = new Set();
    allScores[d] = merged.filter(s => {
      const key = `${s.name}|${s.score}`;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    }).sort((a, b) => b.score - a.score).slice(0, 3);
  });

  const diffNames = {Easy: '🌱', Medium: '🌿', Hard: '🔥', Mixed: '🎲'};
  const diffColors = {Easy: '#2ecc71', Medium: '#f39c12', Hard: '#e74c3c', Mixed: '#0f3460'};

  const diff = gameDifficulty;
  const entries = allScores[diff] || [];

  loading.style.display = 'none';
  grid.style.display = 'grid';
  grid.innerHTML = '';

  if (entries.length === 0) {
    grid.innerHTML = `<div class="leaderboard-empty" style="grid-column:1/-1">
      暫時沒有記錄，成為第一個上榜者吧！🎉
    </div>`;
    return;
  }

  const medals = ['🥇', '🥈', '🥉'];
  entries.forEach((entry, i) => {
    const col = document.createElement('div');
    col.className = 'leaderboard-col';
    const titleColor = i === 0 ? '#f5c518' : diffColors[diff];
    col.innerHTML = `
      <div class="leaderboard-col-title" style="color:${titleColor}">
        ${diffNames[diff]} ${diff}
      </div>
      <div class="leaderboard-entry">
        <span><span class="leaderboard-rank">${medals[i] || (i+1)+'.'}</span>${escapeHtml(entry.name)}</span>
        <span class="leaderboard-score" style="color:${diffColors[diff]}">${entry.score}</span>
      </div>
    `;
    grid.appendChild(col);
  });
}

// ============================================================
// KEYBOARD SUPPORT
// ============================================================

document.addEventListener('keydown', e => {
  if (document.getElementById('gameArea').style.display !== 'block') return;
  if (e.target.tagName === 'INPUT' && e.target.id !== 'calcInput') return;

  if (e.key === 'Enter' && !answered) submitAns();
  if (/^[0-9.]$/.test(e.key)) typeKey(e.key);
  if (e.key === 'Backspace') { e.preventDefault(); typeKey('del'); }
  if (e.key === 'Escape') typeKey('clear');
  if (e.key === '-' && !e.shiftKey) { e.preventDefault(); typeKey('-'); }
});

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ============================================================
// INIT
// ============================================================

(async function init() {
  await loadQuestions();
  document.getElementById('leaderboardDiffLabel').textContent = '(Easy)';
  renderLeaderboard();
})();
</script>
